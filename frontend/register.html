
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ShopU Store</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <a href="index.html" class="logo">Shop<span>U</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="orders.html">My Orders</a>
            <a href="login.html">Login</a>
            <a href="cart.html" class="cart-link">Cart</a>
        </nav>
    </header>

    <!-- Registration Section -->
    <main class="auth-page">

        <div class="auth-card">

            <p class="eyebrow">JOIN OUR STORE</p>

            <h1>Create Your <span>Account</span></h1>

            <p class="auth-description">
                Register today and start exploring our collection.
            </p>

            <form id="register-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

                <p id="auth-message" class="form-message"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 ShopU Store. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
